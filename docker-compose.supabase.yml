services:
  api:
    build: ./backend
    environment:
      # Keep the Supabase connection string server-side. Never expose it through NEXT_PUBLIC_* variables.
      DATABASE_URL: "${SUPABASE_POOLER_DATABASE_URL:?Set SUPABASE_POOLER_DATABASE_URL in .env first}"
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-deploy}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      STRIPE_TAX_ENABLED: ${STRIPE_TAX_ENABLED:-false}
      STRIPE_INVOICE_CREATION_ENABLED: ${STRIPE_INVOICE_CREATION_ENABLED:-true}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@medicii.net}
      ORDERS_EMAIL: ${ORDERS_EMAIL:-orders@medicii.net}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_SENDER: ${GRAPH_SENDER:-noreply@medicii.net}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports: ["8000:8000"]
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    depends_on: [api]
    ports: ["3000:3000"]
